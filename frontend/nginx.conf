# Serves the built SPA and proxies the API to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-running operations: ingestion, OSV sync and agent questions.
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Read-only MCP streamable-HTTP endpoint (optional; only needed if an MCP
    # client should reach the backend through this origin).
    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the SPA shell.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
